<script type="text/x-dc" data-dc-script data-props='{"w":{"editor":"int","default":260,"min":120,"max":520},"reveal":{"editor":"int","default":9,"min":0,"max":9},"ask":{"editor":"enum","options":["pending","asking","answered"],"default":"pending"},"answer":{"editor":"enum","options":["Buton","Görsel"],"default":"Buton"},"grid":{"editor":"boolean","default":false},"$preview":{"width":260,"height":460}}'>
class Component extends DCLogic {
  renderVals() {
    var w = Number(this.props.w ?? 260) || 260;
    var reveal = Number(this.props.reveal ?? 9);
    if (isNaN(reveal)) reveal = 9;
    var ask = this.props.ask ?? 'pending';
    var answer = this.props.answer ?? 'Buton';
    var grid = this.props.grid === true || this.props.grid === 'true';
    var answered = ask === 'answered';
    var isImg = answer === 'Görsel';
    var out = {
      w: w,
      h: Math.round(w * 460 / 260),
      gridD: grid ? 'inline' : 'none',
      btnFill: answered ? 'rgba(110,84,255,0.08)' : 'rgba(232,162,26,0.16)',
      btnStroke: answered ? '#5B43E0' : '#8A5A00',
      btnDash: answered ? 'none' : '6 4',
      btnText: answered ? '#FFFFFF' : '#FFFFFF',
      btnLabel: answered ? (isImg ? 'görsel 0.95' : 'buton 0.96') : (ask === 'asking' ? '? soruldu · 0.52' : '? 0.52'),
      btnLabelW: answered ? (isImg ? 78 : 72) : (ask === 'asking' ? 104 : 46)
    };
    for (var i = 0; i < 9; i++) { out['b' + i] = reveal > i ? 'inline' : 'none'; }
    return out;
  }
}
</script>
